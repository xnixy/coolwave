name: Windows build

# Every push and pull request builds and tests the Windows app. The exe is kept
# with the run's artifacts, and a push to main also publishes it as the
# "latest" release.

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Test
        run: cargo test --locked -p coolwave-core -p coolwave-pump -p coolwave

      - name: Build release
        run: cargo build --release --locked -p coolwave

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: coolwave-windows
          path: target/release/coolwave.exe

      # One rolling release: the old one is replaced so the download link stays the same.
      - name: Publish release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --cleanup-tag --yes || true
          gh release create latest target/release/coolwave.exe \
            --target "$GITHUB_SHA" \
            --title "Coolwave for Windows" \
            --notes "Latest build of main (${GITHUB_SHA::7})." \
            --latest
