name: Windows build

# Every push and pull request builds and tests the Windows app. Nothing is published: the window
# needs the Windows App Runtime files the build stages beside coolwave.exe, so the exe alone would
# not start.

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Test
        run: cargo test --locked -p coolwave-core -p coolwave-pump -p coolwave

      - name: Build release
        run: cargo build --release --locked -p coolwave
