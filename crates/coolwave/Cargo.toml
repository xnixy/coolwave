[package]
name = "coolwave"
version = "0.1.0"
edition = "2024"

[dependencies]
coolwave-core = { version = "0.1.0", path = "../coolwave-core" }
coolwave-pump = { version = "0.1.0", path = "../coolwave-pump" }
toml = "1.1.8"

[target.'cfg(target_os = "linux")'.dependencies]
adw = { version = "0.9.2", package = "libadwaita", features = ["v1_5"] }
gtk = { version = "0.11.5", package = "gtk4", features = ["v4_10"] }
ksni = { version = "0.3.7", features = ["blocking"] }

# The Windows window: native WinUI 3 through Microsoft's windows-reactor, pinned to a windows-rs
# commit (the crates.io release lacks the tray icon, reopenable windows and the window handle).
[target.'cfg(windows)'.dependencies]
coolwave-ui = { version = "0.1.0", path = "../coolwave-ui" }
serde = { version = "1.0.229", features = ["derive"] }
windows-reactor = { git = "https://github.com/microsoft/windows-rs", rev = "63a5e3d9b9afbd57c382d0a4f5a367f134e9dc25" }
# A hidden window, so other threads (a second launch, the pump worker) reach the WinUI thread.
windows-window = { git = "https://github.com/microsoft/windows-rs", rev = "63a5e3d9b9afbd57c382d0a4f5a367f134e9dc25" }
winreg = "0.55"
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"
# Copies the Windows App Runtime next to coolwave.exe, so the WinUI window needs nothing
# installed. The first build downloads it from NuGet.
windows-reactor-setup = { git = "https://github.com/microsoft/windows-rs", rev = "63a5e3d9b9afbd57c382d0a4f5a367f134e9dc25" }
