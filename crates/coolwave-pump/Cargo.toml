[package]
name = "coolwave-pump"
version = "0.1.0"
edition = "2021"
description = "ROG Strix LC IV pump screen (USB 0b05:1de7) for Coolwave, merged from strix-lc-screen 0.4.0"
license = "MIT"

[dependencies]
ab_glyph = "0.2"
anyhow = "1"
coolwave-core = { path = "../coolwave-core" }
libc = "0.2"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "bmp"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
adw = { package = "libadwaita", version = "0.9", features = ["v1_5"] }
gtk = { package = "gtk4", version = "0.11", features = ["v4_14"] }
